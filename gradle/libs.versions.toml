[versions]
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
spring-boot = "3.5.8"
jjwt = "0.12.5"
querydsl = "7.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

springboot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }


[libraries]
# Kotlin
dependency-kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
dependency-kotlin-jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version = "2.16.1" }
dependency-kotlin-coroutine = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.8.0" }

# Springboot
development-springboot-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
dependency-springboot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
dependency-springboot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
dependency-springboot-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
dependency-springboot-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket", version.ref = "spring-boot" }
dependency-springboot-aop = { module = "org.springframework.boot:spring-boot-starter-aop", version.ref = "spring-boot" }
dependency-springboot-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
dependency-springboot-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc", version.ref = "spring-boot" }
dependency-springboot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
dependency-springboot-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
dependency-springboot-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client", version.ref = "spring-boot" }
dependency-springboot-oauth2-resource = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "spring-boot" }
dependency-springboot-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb", version.ref = "spring-boot" }
dependency-springboot-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
dependency-springboot-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version.ref = "spring-boot" }

# Spring
dependency-spring-aspects = { module = "org.springframework:spring-aspects" }
dependency-spring-kafka = { module = "org.springframework.kafka:spring-kafka", version = "3.3.2" }
dependency-spring-retry = { module = "org.springframework.retry:spring-retry" }

# QueryDSL
dependency-querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
dependency-querydsl-mongodb = { module = "io.github.openfeign.querydsl:querydsl-mongodb", version.ref = "querydsl" }
dependency-querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }
dependency-querydsl-ksp = { module = "io.github.openfeign.querydsl:querydsl-ksp-codegen", version.ref = "querydsl" }

# Observability
dependency-micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version = "1.14.2" }
dependency-micrometer-tracing-brave = { module = "io.micrometer:micrometer-tracing-bridge-brave", version = "1.4.1" }
dependency-logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "7.4" }
dependency-p6spy-starter = { module = "com.github.gavlyukovskiy:p6spy-spring-boot-starter", version = "1.10.0" }

# Infrastructure
runtimeonly-h2 = { module = "com.h2database:h2" }
runtimeonly-mysql = { module = "com.mysql:mysql-connector-j", version = "8.3.0" }
runtimeonly-oracle = { module = "com.oracle.database.jdbc:ojdbc11", version = "23.4.0.24.05" }
runtimeonly-sqlite = { module = "org.xerial:sqlite-jdbc" }
runtimeonly-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
dependency-aws-s3 = { module = "software.amazon.awssdk:s3", version = "2.25.15" }

# ETC
dependency-redisson = { module = "org.redisson:redisson", version = "3.51.0" }
dependency-jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version = "2.16.1" }
dependency-swagger3 = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "2.8.9" }
dependency-caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version = "3.1.8" }
dependency-jjwt = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
dependency-jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
dependency-jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Test
test-kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version = "5.9.0" }
test-kotest-runner = { module = "io.kotest:kotest-runner-junit5-jvm", version = "5.9.0" }
test-kotest-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version = "1.1.3" }
test-mockk = { module = "io.mockk:mockk", version = "1.13.10" }

test-springboot = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
test-springboot-security = { module = "org.springframework.security:spring-security-test", version.ref = "spring-boot" }
test-testcontainers = { module = "org.testcontainers:testcontainers", version = "1.20.4" }
test-testcontainers-redis = { module = "com.redis.testcontainers:testcontainers-redis", version = "2.2.2" }

# AOP
dependency-aspectj = { module = "org.aspectj:aspectjweaver", version = "1.9.20" }
dependency-aspectj-runtime = { module = "org.aspectj:aspectjrt", version = "1.9.20" }

[bundles]
kotlin = ["dependency-kotlin-reflect", "dependency-kotlin-jackson", "dependency-kotlin-coroutine"]
test-kotest = ["test-kotest-assertions", "test-kotest-runner"]
jjwt = ["dependency-jjwt", "dependency-jjwt-impl", "dependency-jjwt-jackson"]