# === Geral ===
error.unexpected=Algo deu errado no nosso servidor. Por favor, tente novamente em instantes.
common.invalid-argument=Por favor, verifique suas informações e tente novamente.
common.bad-request=Não conseguimos processar sua solicitação. Por favor, tente novamente.
common.not-found=A página ou o conteúdo que você procura não existe.
common.conflict=Essa informação já está em uso. Por favor, tente algo diferente.
common.optimistic-lock-failure=Outra pessoa fez alterações ao mesmo tempo. Por favor, atualize a página e tente novamente.

# === Login ===
auth.unauthorized=Por favor, faça login para continuar.
auth.invalid-request=Algo deu errado. Por favor, faça login novamente.
auth.invalid-token=Sua sessão não é mais válida. Por favor, faça login novamente.
auth.token-expired=Sua sessão expirou. Por favor, faça login novamente.
auth.invalid-role=Você não tem permissão para fazer isso.

# === Usuário ===
member.not-found=Esta conta não existe. Pode ter sido excluída ou desativada.
member.init.id.duplicated=Esse nome de usuário já está em uso. Por favor, escolha outro.
member.init.id.invalid=O nome de usuário deve ter entre 3 e 20 caracteres e pode conter apenas letras minúsculas, números e sublinhados.
member.init.handle.invalid=O nome de usuário deve ter entre 3 e 20 caracteres e pode conter apenas letras minúsculas, números e sublinhados.
member.init.handle.duplicated=Esse nome de usuário já está em uso. Por favor, escolha outro.
member.init.incomplete=Por favor, preencha todos os campos obrigatórios.

# === Perfil ===
profile.not-found=Perfil não encontrado. Pode ter sido excluído.

# === Social ===
social.block.self=Você não pode bloquear a si mesmo.
social.follow.self=Você não pode seguir a si mesmo.
social.follow.blocked=Você não pode seguir esta pessoa agora.

