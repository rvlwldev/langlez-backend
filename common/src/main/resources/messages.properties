# 지우지 마라. 내용이 비어 있어도 이 파일은 반드시 존재해야 한다.
#
# Spring Boot 의 MessageSourceAutoConfiguration 은 ResourceBundleCondition 으로
# `classpath*:{basename}.properties` — 즉 로케일 접미사가 없는 이 파일 — 이 실제로 있는지만 보고
# messageSource 빈을 만들지 말지 정한다. messages_ko/en/... 12개가 아무리 있어도
# 이 파일이 없으면 조건이 안 맞아 빈이 아예 안 생기고, 그 자리를 DelegatingMessageSource 가 채운다.
# 그러면 모든 키 조회가 NoSuchMessageException 이 되고 GlobalRestControllerAdvice 가 키로 폴백해
# `{"status":"NOT_FOUND","message":"profile.not-found"}` 처럼 i18n 키 문자열이 그대로 사용자에게 나간다.
#
# 실제로 그 상태였다. 2026-02-10 에 옛 common/i18n 서브모듈을 정리하면서 이 파일이 함께 사라졌고,
# 지금의 12개 번들에는 처음부터 짝이 없었다. 회귀 방지는 app/api 의 MessageSourceAutoConfigurationTest 가 한다.
#
# 번역문은 여기 넣지 않는다. 로케일별 파일이 정본이고 이 파일은 조건을 만족시키는 역할만 한다.
