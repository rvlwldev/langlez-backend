# === Chung ===
error.unexpected=Đã xảy ra sự cố trên máy chủ của chúng tôi. Vui lòng thử lại sau.
common.invalid-argument=Vui lòng kiểm tra thông tin đã nhập và thử lại.
common.bad-request=Chúng tôi không thể xử lý yêu cầu của bạn. Vui lòng thử lại.
common.not-found=Trang hoặc nội dung bạn tìm không tồn tại.
common.not-found-endpoint=Không tìm thấy API endpoint bạn yêu cầu.
common.conflict=Thông tin này đã được sử dụng. Vui lòng thử thứ khác.
common.optimistic-lock-failure=Người khác đã thực hiện thay đổi cùng lúc. Vui lòng làm mới trang và thử lại.

# === Đăng nhập ===
auth.unauthorized=Vui lòng đăng nhập để tiếp tục.
auth.invalid-request=Có gì đó xảy ra. Vui lòng đăng nhập lại.
auth.invalid-token=Phiên đăng nhập của bạn không còn hợp lệ. Vui lòng đăng nhập lại.
auth.token-expired=Phiên đăng nhập của bạn đã hết hạn. Vui lòng đăng nhập lại.
auth.invalid-role=Bạn không có quyền thực hiện thao tác này.
auth.email-conflict=Email này đã được đăng ký bằng phương thức đăng nhập khác. Vui lòng sử dụng phương thức đăng nhập ban đầu.

# === Thành viên ===
member.not-found=Tài khoản này không tồn tại. Có thể đã bị xóa hoặc vô hiệu hóa.
member.init.id.duplicated=Tên người dùng này đã được sử dụng. Vui lòng chọn tên khác.
member.init.id.invalid=Tên người dùng phải từ 3–20 ký tự và chỉ được dùng chữ thường, số và dấu gạch dưới.
member.init.handle.invalid=Tên người dùng phải từ 3–20 ký tự và chỉ được dùng chữ thường, số và dấu gạch dưới.
member.init.handle.duplicated=Tên người dùng này đã được sử dụng. Vui lòng chọn tên khác.
member.init.incomplete=Vui lòng điền đầy đủ các trường bắt buộc.

# === Hồ sơ ===
profile.not-found=Không tìm thấy hồ sơ. Có thể đã bị xóa.

# === Mạng xã hội ===
social.block.self=Bạn không thể chặn chính mình.
social.follow.self=Bạn không thể theo dõi chính mình.
social.follow.blocked=Bạn hiện không thể theo dõi người dùng này.

# === Xác thực đầu vào ===
validation.member.bio.size=Tiểu sử phải không quá 200 ký tự.
validation.member.goal.size=Mục tiêu học tập phải không quá 500 ký tự.
validation.member.want.size=Mô tả người bạn học mong muốn phải không quá 500 ký tự.
validation.member.address.size=Địa chỉ phải không quá 200 ký tự.
