# === 공통 ===
error.unexpected=서버에 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.
common.invalid-argument=입력값이 올바르지 않습니다. 다시 확인해 주세요.
common.bad-request=요청을 처리할 수 없습니다. 다시 시도해 주세요.
common.not-found=요청하신 페이지 또는 정보를 찾을 수 없습니다.
common.not-found-endpoint=요청하신 API 경로를 찾을 수 없습니다.
common.conflict=이미 사용 중인 정보입니다. 다른 값을 입력해 주세요.
common.optimistic-lock-failure=다른 사용자가 동시에 변경했습니다. 새로고침 후 다시 시도해 주세요.

# === 인증 ===
auth.unauthorized=로그인이 필요합니다.
auth.invalid-request=요청을 처리할 수 없습니다. 다시 로그인해 주세요.
auth.invalid-token=세션이 유효하지 않습니다. 다시 로그인해 주세요.
auth.token-expired=세션이 만료되었습니다. 다시 로그인해 주세요.
auth.invalid-role=이 기능을 사용할 권한이 없습니다.
auth.email-conflict=이미 다른 로그인 방식으로 가입된 이메일입니다. 기존 로그인 방식을 이용해 주세요.

# === 회원 ===
member.not-found=가입되지 않은 사용자입니다. 탈퇴하거나 비활성화된 계정일 수 있습니다.
member.init.id.duplicated=이미 사용 중인 아이디입니다. 다른 아이디를 선택해 주세요.
member.init.id.invalid=아이디는 영문 소문자, 숫자, _ 만 사용 가능하며 3~20자여야 합니다.
member.init.handle.invalid=아이디는 영문 소문자, 숫자, _ 만 사용 가능하며 3~20자여야 합니다.
member.init.handle.duplicated=이미 사용 중인 아이디입니다. 다른 아이디를 선택해 주세요.
member.init.incomplete=필수 입력 항목을 모두 입력해 주세요.

# === 프로필 ===
profile.not-found=프로필을 찾을 수 없습니다.

