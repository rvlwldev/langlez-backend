# === 通用 ===
error.unexpected=伺服器發生問題，請稍後再試。
common.invalid-argument=請檢查輸入內容後再試。
common.bad-request=無法處理您的請求，請再試。
common.not-found=您要找的頁面或內容不存在。
common.conflict=該資訊已被使用，請嘗試其他內容。
common.optimistic-lock-failure=其他使用者同時進行了修改，請刷新後再試。

# === 登入 ===
auth.unauthorized=請先登入。
auth.invalid-request=請求處理失敗，請重新登入。
auth.invalid-token=登入狀態已失效，請重新登入。
auth.token-expired=登入已過期，請重新登入。
auth.invalid-role=您沒有權限執行此操作。
auth.email-conflict=該信箱已透過其他登入方式註冊。請使用原來的登入方式。

# === 會員 ===
member.not-found=此帳號不存在，可能已被注銷或停用。
member.init.id.duplicated=該用戶名已被使用，請選擇其他用戶名。
member.init.id.invalid=用戶名必須為3～20個字元，僅支援英文小寫、數字和底線。
member.init.handle.invalid=用戶名必須為3～20個字元，僅支援英文小寫、數字和底線。
member.init.handle.duplicated=該用戶名已被使用，請選擇其他用戶名。
member.init.incomplete=請填寫所有必填項目。

# === 個人資料 ===
profile.not-found=找不到該用戶資料。

