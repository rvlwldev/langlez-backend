name: langlez

networks:
  langlez-net:
    driver: bridge

# KRaft 단일 노드. broker 와 controller 를 겸한다.
#
# 리스너가 둘인 이유: 컨테이너끼리는 서비스명(kafka:19092)으로 붙고, 호스트의 앱은
# localhost:9092 로 붙는다. 광고 주소가 하나뿐이면 둘 중 하나는 반드시 실패한다.
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: langlez-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 노드가 하나라 복제본도 하나다. 3 으로 두면 내부 토픽을 만들지 못해 컨슈머가 뜨지 않는다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: taSQVZBOTkmWAqfHUhpynw
      # 컨테이너 제한 1G 안에서 JVM 힙을 잡는다. 나머지는 페이지 캐시와 네이티브 버퍼 몫.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - ./volume/kafka/single:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - langlez-net

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: langlez-kafka-ui
    ports:
      - "8081:8080"
    environment:
      # 컨테이너끼리는 INTERNAL 리스너로 붙는다. EXTERNAL(localhost:9092)은 호스트 전용.
      KAFKA_CLUSTERS_0_NAME: langlez
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: -Xmx160m
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - langlez-net
