name: langlez

networks:
  langlez-net:
    driver: bridge

services:
  postgresql:
    image: postgres:16
    container_name: langlez-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: langlez_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volume/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d langlez_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - langlez-net
