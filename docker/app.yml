name: langlez-app

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: langlez-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - langlez-net
    depends_on:
      - app-blue
      - app-green

  app-blue:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: langlez-server:latest
    container_name: langlez-app-blue
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - ../.env
    ports:
      - "8081:8080"
    networks:
      - langlez-net

  app-green:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: langlez-server:latest
    container_name: langlez-app-green
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - ../.env
    ports:
      - "8082:8080"
    networks:
      - langlez-net

networks:
  langlez-net:
    name: langlez-net
    driver: bridge
