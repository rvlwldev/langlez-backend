name: langlez-app

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: langlez-server:latest
    container_name: langlez-app
    environment:
      - SPRING_PROFILES_ACTIVE=production
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    networks:
      - langlez-net

networks:
  langlez-net:
    name: langlez-net
    driver: bridge
