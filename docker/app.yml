name: langlez-app

services:
  app-blue:
    build:
      context: ../
      dockerfile: Dockerfile
    image: langlez-server:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - ../.env
    ports:
      - "8081:8080"
    networks:
      - langlez-net

  app-green:
    build:
      context: ../
      dockerfile: Dockerfile
    image: langlez-server:latest
    container_name: langlez-app-green
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - ../.env
    ports:
      - "8082:8080"
    networks:
      - langlez-net

networks:
  langlez-net:
    name: langlez-net
    external: true
