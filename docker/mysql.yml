name: langlez-mysql

networks:
  langlez-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: langlez-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: langlez_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - ./volume/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - langlez-net