server:
  http_listen_port: 3200

distributor:
  receivers:
    zipkin:                # 앱(brave)이 보내는 zipkin 포맷 트레이스 수신 (포트 9411)

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h   # 로컬 개발: 트레이스 24시간 보관

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
