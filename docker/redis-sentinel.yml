name: langlez-redis

networks:
  langlez-net:
    driver: bridge

services:
  redis-master:
    image: redis:7.2
    container_name: langlez-redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./volume/redis/data:/data
      - ./config/redis.conf:/etc/redis.conf
    networks:
      - langlez-net
    command: [ "redis-server", "/etc/redis.conf" ]

  redis-replica1:
    image: redis:7.2
    container_name: langlez-redis-replica1
    ports:
      - "16379:6379"
    volumes:
      - ./config/redis.conf:/etc/redis.conf
    depends_on:
      - redis-master
    networks:
      - langlez-net
    command: [ "redis-server", "/etc/redis.conf", "--replicaof", "redis-master", "6379" ]

  redis-replica2:
    image: redis:7.2
    container_name: langlez-redis-replica2
    ports:
      - "26379:6379"
    volumes:
      - ./config/redis.conf:/etc/redis.conf
    depends_on:
      - redis-master
    networks:
      - langlez-net
    command: [ "redis-server", "/etc/redis.conf", "--replicaof", "redis-master", "6379" ]

  redis-sentinel1:
    image: redis:7.2
    container_name: langlez-redis-sentinel1
    ports:
      - "26380:26379"
    volumes:
      - ./config/redis-sentinel.conf:/etc/redis-sentinel.conf
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2
    networks:
      - langlez-net
    command: [ "redis-sentinel", "/etc/redis-sentinel.conf" ]

  redis-sentinel2:
    image: redis:7.2
    container_name: langlez-redis-sentinel2
    ports:
      - "26381:26379"
    volumes:
      - ./config/redis-sentinel.conf:/etc/redis-sentinel.conf
    depends_on:
      - redis-master
    networks:
      - langlez-net
    command: [ "redis-sentinel", "/etc/redis-sentinel.conf" ]

  redis-sentinel3:
    image: redis:7.2
    container_name: langlez-redis-sentinel3
    ports:
      - "26382:26379"
    volumes:
      - ./config/redis-sentinel.conf:/etc/redis-sentinel.conf
    depends_on:
      - redis-master
    networks:
      - langlez-net
    command: [ "redis-sentinel", "/etc/redis-sentinel.conf" ]