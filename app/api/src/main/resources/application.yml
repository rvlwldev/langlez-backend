server:
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 1m
    max-connections: 8192
    accept-count: 100
    keep-alive-timeout: 60s
  max-http-request-header-size: 8KB
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  port: 8080

spring:
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  
  # Data Sources
  datasource:
    url: jdbc:mysql://localhost:3306/langlez_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    # username/password는 application-local.yml 또는 환경 변수(DB_USERNAME, DB_PASSWORD)로 설정
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/langlez_db?directConnection=true
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false   # RedissonClient를 직접 사용, Spring Data Redis Repository는 쓰지 않음

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true

  # Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            # client-id/secret은 application-local.yml 또는 환경 변수(GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)로 설정
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          apple:
            # client-id/secret은 application-local.yml 또는 환경 변수(APPLE_CLIENT_ID, APPLE_CLIENT_SECRET)로 설정
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            scope: name, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  # Logging & Decorators
  decorator:
    datasource:
      enabled: true
      p6spy:
        enable-logging: true
        multiline: true
        logging: none

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

jwt:
  # secret은 application-local.yml 또는 환경 변수(JWT_SECRET_KEY)로 설정
  secret: ${JWT_SECRET_KEY}
  access-token-ttl-secs: 3600
  refresh-token-ttl-secs: 1209600

app:
  storage:
    profile-path: profile
  oauth2:
    redirect-uri: "http://localhost:3000/oauth2/callback"
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

swagger:
  enabled: true
  title: "Langlez API Documentation (Local)"
  description: "Local development API documentation for Langlez Backend"
  version: "1.0.0"
  contact:
    name: "Langlez Development Team"
    email: "dev@langlez.com"
    url: "https://langlez.com"
  servers:
    - url: "http://localhost:8080"
      description: "Local Development Server"
  jwt:
    enabled: true
    header-name: "Authorization"
    token-prefix: "Bearer "

# Actuator / Metrics / Tracing (관측)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0          # 로컬: 전량 샘플링
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans   # Tempo zipkin receiver

# 슬로우 쿼리 추적 임계값 (P6Spy / PerformanceLogger)
logger:
  mysql:
    log-threshold-ms: 0         # 로컬: 모든 쿼리 TRACE 로깅 (가시성)
    warn-threshold-ms: 500      # 500ms 이상 → 슬로우 쿼리 WARN
  mongo:
    log-threshold-ms: 0
    warn-threshold-ms: 500
  redis:
    log-threshold-ms: 0
    warn-threshold-ms: 100

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

