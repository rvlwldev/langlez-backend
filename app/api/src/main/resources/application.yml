server:
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 1m
    max-connections: 8192
    accept-count: 100
    keep-alive-timeout: 60s
  max-http-request-header-size: 8KB
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  port: 8080

spring:
  threads:
    virtual:
      enabled: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  # Data Sources — 로컬 개발용 값 (운영은 application-production.yml의 환경 변수로 대체됨)
  datasource:
    # reWriteBatchedInserts=true — 배치 INSERT 를 다중 VALUES 한 문장으로 합친다
    url: jdbc:postgresql://localhost:5432/langlez_db?reWriteBatchedInserts=true
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/langlez_db?directConnection=true
      # true 로 두면 MongoTemplate 빈 생성 시점(컨텍스트 refresh 중)에 ChatMessage 인덱스를 동기로 쏜다.
      # Mongo 가 응답하지 않으면 서버 선택 타임아웃(30초)까지 블로킹한 뒤 컨텍스트 refresh 자체가 취소돼
      # chat 과 무관한 기동까지 막는다. 인덱스는 infra:mongo 의 MongoIndexInitializer 가
      # 기동 후 별도 스케줄로 만든다 — 이 플래그를 다시 true 로 되돌리지 않는다.
      auto-index-creation: false
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false   # RedissonClient를 직접 사용, Spring Data Redis Repository는 쓰지 않음

  kafka:
    # 3노드 전부 적는다. 한 대만 적으면 그 브로커가 죽었을 때 부트스트랩 자체가 실패한다.
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all              # 모든 ISR 확인. 아웃박스가 이 ack 를 보고 COMPLETE 를 찍는다
      properties:
        enable.idempotence: true   # 아웃박스 재발행 시 브로커단 중복 제거
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false    # 핸들러 성공 후 커밋 (at-least-once)
    listener:
      ack-mode: record       # 레코드 1건 처리마다 커밋. BATCH 면 배치 도중 죽었을 때 처리분까지 재배달된다
      # 오토컨피그 기본값은 컨슈머 스레드 1개라 파티션을 늘려도 처리량이 안 는다.
      # 파티션 수를 넘겨도 남는 컨슈머가 놀 뿐이라 3으로 잡는다.
      concurrency: 3

  flyway:
    # 마이그레이션 위치는 infra:rdb 의 RdbConfiguration 이 지정한다
    enabled: true

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 맞는지 검사만 한다.
      # update 로 두면 Flyway 와 Hibernate 가 각자 스키마를 건드려 더 나빠진다.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_updates: true
        order_inserts: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            # 로컬 개발용 dummy 값 (운영은 application-production.yml의 환경 변수로 대체됨)
            client-id: google-dummy-id.apps.googleusercontent.com
            client-secret: google-dummy-secret
            scope: profile, email
          apple:
            # 로컬 개발용 dummy 값 (운영은 application-production.yml의 환경 변수로 대체됨)
            client-id: apple-dummy-id
            client-secret: apple-dummy-secret
            scope: name, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  # Logging & Decorators
  decorator:
    datasource:
      enabled: true
      p6spy:
        enable-logging: true
        multiline: true
        logging: none

storage:
  bucket: langlez
  region: local
  base-url: "http://localhost:${server.port:8080}/attachments"
  access-key: "STORAGE_ACCESS_KEY_ID"
  secret-key: "STORAGE_SECRET_ACCESS_KEY"

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

jwt:
  # 로컬 개발용 dummy 시크릿 (운영은 application-production.yml의 JWT_SECRET_KEY 환경 변수로 대체됨)
  secret: "c2lsdmVyLWJ1bGxldC1sYW5nbGV6LXByb2plY3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ="
  access-token-ttl-secs: 3600
  refresh-token-ttl-secs: 1209600

app:
  storage:
    profile-path: profile
  oauth2:
    redirect-uri: "http://localhost:3000/oauth2/callback"
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

swagger:
  enabled: true
  title: "Langlez API Documentation (Local)"
  description: "Local development API documentation for Langlez Backend"
  version: "1.0.0"
  contact:
    name: "Langlez Development Team"
    email: "admin@langlez.com"
    url: "https://langlez.com"
  servers:
    - url: "http://localhost:8080"
      description: "Local Development Server"
  jwt:
    enabled: true
    header-name: "Authorization"
    token-prefix: "Bearer "

# Actuator / Metrics / Tracing (관측)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0          # 로컬: 전량 샘플링
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans   # Tempo zipkin receiver

# 슬로우 쿼리 추적 임계값 (P6Spy / PerformanceLogger)
logger:
  rdb:
    log-threshold-ms: 0         # 로컬: 모든 쿼리 TRACE 로깅 (가시성)
    warn-threshold-ms: 500      # 500ms 이상 → 슬로우 쿼리 WARN
  mongo:
    log-threshold-ms: 0
    warn-threshold-ms: 500
  redis:
    log-threshold-ms: 0
    warn-threshold-ms: 100

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

