spring:
  profiles:
    include:
      - auth
    validate: true

# Swagger Configuration - Only enabled in local environment
swagger:
  enabled: false  # Default disabled, will be overridden by profiles
---
spring:
  config:
    activate:
      on-profile: local
    import:
      - classpath:mysql-local.yml
      - classpath:mongo-local.yml
      - classpath:redis-local.yml
      - classpath:kafka-local.yml
  logging:
    level:
      org.hibernate.SQL: INFO # P6Spy handles SQL logging
      org.hibernate.orm.jdbc.bind: INFO
  decorator:
    datasource:
      enabled: true
      p6spy:
        enable-logging: true
        multiline: false
        logging: none # We use P6SpyEventListener via PerformanceLogger

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: google-dummy-id.apps.googleusercontent.com
            client-secret: google-dummy-secret
            scope: profile, email
          apple:
            client-id: apple-dummy-id
            client-secret: apple-dummy-secret
            scope: name, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
  jwt:
    secret: "c2lsdmVyLWJ1bGxldC1sYW5nbGV6LXByb2plY3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ=" # Base64 encoded dummy key
    expiration: 3600000 # 1 hour
    refresh-expiration: 1209600000 # 14 days

# Swagger Configuration - Local Environment
swagger:
  enabled: true
  title: "Langlez API Documentation (Local)"
  description: "Local development API documentation for Langlez Backend"
  version: "1.0.0"
  contact:
    name: "Langlez Development Team"
    email: "dev@langlez.com"
    url: "https://langlez.com"
  servers:
    - url: "http://localhost:8080"
      description: "Local Development Server"
  jwt:
    enabled: true
    header-name: "Authorization"
    token-prefix: "Bearer "

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - classpath:mysql-prod.yml
      - classpath:mongo-prod.yml
      - classpath:redis-prod.yml
      - classpath:kafka-prod.yml
  
  # P6Spy Configuration for Prod
  decorator:
    datasource:
      enabled: true
      p6spy:
        enable-logging: true
        logging: none
        log-filter:
          pattern: .*
  
  # P6Spy Execution Threshold (1000ms = 1s)
  # Note: This property might need to be set via System Property or spy.properties if Spring wrapper doesn't support it directly in yaml for all versions,
  # but gavlyukovskiy starter usually supports 'decorator.datasource.p6spy.tracing.min-time' or similar?
  # Let's check the verify step later. Standard P6Spy uses executionThreshold.
  # The starter maps 'decorator.datasource.p6spy.log-message-format' to custom bean.
  
  jpa:
    properties:
      hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 0 # Disable Hibernate slow query log in favor of P6Spy
  logging:
    level:
      org.hibernate.SQL: OFF
      org.hibernate.SQL_SLOW: OFF # We leverage P6Spy for slow queries
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
            apple:
              client-id: ${APPLE_CLIENT_ID}
              client-secret: ${APPLE_CLIENT_SECRET}
  jwt:
    secret: ${JWT_SECRET_KEY} # Managed by GitHub Secrets / Environment Variables
    expiration: 3600000 # 1 hour
    refresh-expiration: 1209600000 # 14 days

# Swagger Configuration - Production Environment
swagger:
  enabled: false  # Explicitly disabled in production
  