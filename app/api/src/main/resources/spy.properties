# P6Spy Configuration
# JDBC 가로채기(P6SpyFactory)만 사용. 로깅은 P6Spy 자체 appender(spy.log)가 아니라
# LoggerConfiguration의 커스텀 JdbcEventListener -> PerformanceLogger 경로로만 나간다.
#
# appender 를 지정 안 하면 P6Spy 기본값(FileLogger)이 JVM 작업 디렉터리에 spy.log 를
# 써버린다(모듈별로 따로 실행하면 모듈마다 하나씩 생김, Promtail 수집 경로 밖이라 그라파나에서
# 안 보임). Slf4JLogger 로 돌려서 파일 생성 자체를 막는다. 이 경로는 logback-spring.xml 에서
# "p6spy" 로거를 OFF 시켜서 커스텀 리스너 경로와 중복 안 찍히게 한다.
modulelist=com.p6spy.engine.spy.P6SpyFactory
executionThreshold=100
appender=com.p6spy.engine.spy.appender.Slf4JLogger
