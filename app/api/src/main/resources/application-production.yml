server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 1m
    max-connections: 10000
    accept-count: 200
    keep-alive-timeout: 60s

spring:
  threads:
    virtual:
      enabled: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  # Data Sources - TODO: Fill in production values or use environment variables
  datasource:
    # TODO: reWriteBatchedInserts=true 파라미터 포함 여부 확인
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:5000}
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    mongodb:
      uri: ${MONGO_URI}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  kafka:
    # 이 줄이 없으면 application.yml 의 `localhost:9092,9094,9096` 이 프로필 병합으로 상속돼
    # 운영이 로컬 브로커를 본다. 아웃박스가 PENDING 으로만 쌓이고 모듈 간 이벤트가 조용히 멈춘다.
    #
    # 기본값을 두지 않는다. 변수를 빼뜨리면 기동이 실패한다 (실측:
    # `ConfigException: Invalid url in bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS}`).
    # 조용히 도는 것보다 못 뜨는 게 낫다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    # 아래는 application.yml 에서 상속되는 값이지만 다시 적는다.
    # 아웃박스의 정합성에 직결되는 설정이라 운영 파일만 읽어도 보이게 둔다.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all              # 모든 ISR 확인. 아웃박스가 이 ack 를 보고 COMPLETE 를 찍는다
      properties:
        enable.idempotence: true   # 아웃박스 재발행 시 브로커단 중복 제거
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false    # 핸들러 성공 후 커밋 (at-least-once)
    listener:
      ack-mode: record       # 레코드 1건 처리마다 커밋. BATCH 면 배치 도중 죽었을 때 처리분까지 재배달된다
      concurrency: 3         # 오토컨피그 기본값(1)로 폴백하면 파티션을 늘려도 처리량이 안 는다

  jpa:
    hibernate:
      # none 이면 스키마가 어긋나도 런타임에야 터진다. validate 로 기동 시점에 잡는다.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_updates: true
        order_inserts: true

  # Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-ttl-secs: 3600 # 1시간
  refresh-token-ttl-secs: 1209600 #2주

app:
  oauth2:
    # TODO: 프론트엔드 운영 URL로 변경
    # redirect-uri: "https://app.langlez.com/oauth2/callback"
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  cors:
    # TODO: 프로덕션 프론트엔드 허용 오리진 리스트 설정 (예: CORS_ALLOWED_ORIGINS 또는 명시적 도메인)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# TODO : S3나 CloudFlare 설정 추가
storage:
  bucket: langlez
  region: ${STORAGE_REGION}
  base-url: ${STORAGE_BASE_URL}
  access-key: ${STORAGE_ACCESS_KEY_ID}
  secret-key: ${STORAGE_SECRET_ACCESS_KEY}

logging:
  level:
    root: INFO
    com.langlez: INFO

swagger:
  enabled: false # Disabled in production for security

# Actuator / Metrics / Tracing (관측)
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus   # 운영: 최소 노출
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}   # 운영: 10% 샘플링
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

# 슬로우 쿼리 추적 임계값 (운영: 느린 쿼리만)
logger:
  rdb:
    log-threshold-ms: 200
    warn-threshold-ms: 1000
  mongo:
    log-threshold-ms: 200
    warn-threshold-ms: 1000
  redis:
    log-threshold-ms: 100
    warn-threshold-ms: 500
