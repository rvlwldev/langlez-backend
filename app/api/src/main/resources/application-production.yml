server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 1m
    max-connections: 10000
    accept-count: 200
    keep-alive-timeout: 60s

spring:
  # Data Sources - TODO: Fill in production values or use environment variables
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/langlez_db}
    username: ${MYSQL_USERNAME:admin}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/langlez_db}
    redis:
      sentinel:
        master: ${REDIS_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:localhost:26380,localhost:26381,localhost:26382}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  # Security & OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-ttl-secs: 3600
  refresh-token-ttl-secs: 1209600

app:
  oauth2:
    # TODO: 프론트엔드 운영 URL로 변경
    # redirect-uri: "https://app.langlez.com/oauth2/callback"
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  cors:
    # TODO: 프로덕션 프론트엔드 허용 오리진 리스트 설정 (예: CORS_ALLOWED_ORIGINS 또는 명시적 도메인)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.langlez.com}

logging:
  level:
    root: INFO
    com.langlez: INFO

swagger:
  enabled: false # Disabled in production for security

# Actuator / Metrics / Tracing (관측)
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus   # 운영: 최소 노출
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}   # 운영: 10% 샘플링
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# 슬로우 쿼리 추적 임계값 (운영: 느린 쿼리만)
logger:
  mysql:
    log-threshold-ms: 200
    warn-threshold-ms: 1000
  mongo:
    log-threshold-ms: 200
    warn-threshold-ms: 1000
  redis:
    log-threshold-ms: 100
    warn-threshold-ms: 500
