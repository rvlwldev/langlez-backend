server:
  #  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: langlez-backend

spring:
  threads:
    virtual:
      enabled: true
  config:
    import:
      - optional:classpath:mysql-local.yml
      - optional:classpath:mongo-local.yml
      - optional:classpath:redis-local.yml
      - optional:classpath:kafka-local.yml
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  messages: # i18n
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true

  logging:
    level:
      org.hibernate.SQL: INFO # P6Spy 로 SQL Logging
      org.hibernate.orm.jdbc.bind: INFO

  decorator:
    datasource:
      enabled: true
      p6spy:
        enable-logging: true
        multiline: true
        logging: none # PerformanceLogger 를 통해 P6SpyEventListener 사용중

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: google-dummy-id.apps.googleusercontent.com
            client-secret: google-dummy-secret
            scope: profile, email
          apple:
            client-id: apple-dummy-id
            client-secret: apple-dummy-secret
            scope: name, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/apple"
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

jwt:
  secret: "c2lsdmVyLWJ1bGxldC1sYW5nbGV6LXByb2plY3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ="
  access-token-validity-in-seconds: 3600
