# Swagger Configuration - Local Environment
swagger:
  enabled: true
  title: "Langlez API Documentation (Local)"
  description: "Local development API documentation for Langlez Backend"
  version: "1.0.0"
  contact:
    name: "Langlez Development Team"
    email: "dev@langlez.com"
    url: "https://langlez.com"
  servers:
    - url: "http://localhost:8080"
      description: "Local Development Server"
  jwt:
    enabled: true
    header-name: "Authorization"
    token-prefix: "Bearer "
