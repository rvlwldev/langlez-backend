server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

spring:
  config:
    import:
      - classpath:mysql-prod.yml
      - classpath:mongo-prod.yml
      - classpath:redis-prod.yml
      - classpath:kafka-prod.yml
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  messages: # i18n
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true

  decorator:
    datasource:
      enabled: true
      p6spy:
        multiline: true
        enable-logging: true
        logging: none
        log-filter:
          pattern: .*
  jpa:
    properties:
      hibernate.session.events.log:
        LOG_QUERIES_SLOWER_THAN_MS: 0 # Disable Hibernate slow query log in favor of P6Spy
  logging:
    level:
      org.hibernate.SQL: OFF
      org.hibernate.SQL_SLOW: OFF # We leverage P6Spy for slow queries
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
            apple:
              client-id: ${APPLE_CLIENT_ID}
              client-secret: ${APPLE_CLIENT_SECRET}
  jwt:
    secret: ${JWT_SECRET_KEY} # Managed by GitHub Secrets / Environment Variables
    expiration: 3600000 # 1 hour
    refresh-expiration: 1209600000 # 14 days

# Swagger Configuration - Production Environment
swagger:
  enabled: false  # Explicitly disabled in production
