<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: header('참여 중인 채팅방')}"></head>
<body>
    <div class="app-container">
        <div th:replace="~{admin/layout :: sidebar('users')}"></div>
        
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title" th:text="'@' + ${username} + ' 님의 채팅방 목록'">@username 님의 채팅방 목록</h1>
                    <p class="page-subtitle">해당 유저가 참여 중인 채팅방 목록을 조회합니다.</p>
                </div>
            </div>
            
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Room ID</th>
                            <th>참여자</th>
                            <th>최근 메시지</th>
                            <th>마지막 전송 시각</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="chat : ${chats}">
                            <td th:text="${chat.roomId}">Room ID</td>
                            <td th:text="${#strings.listJoin(chat.participantUsernames, ', ')}">User1, User2</td>
                            <td th:text="${chat.lastMessagePreview ?: '(메시지 없음)'}">Preview</td>
                            <td th:text="${chat.lastMessageAt ?: '-'}">2026-07-19T00:00:00Z</td>
                            <td>
                                <a th:href="@{/admin/chats/{roomId}(roomId=${chat.roomId})}" class="link-action">방 보기</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(chats)}">
                            <td colspan="5" style="text-align: center; color: var(--text-secondary);">참여 중인 채팅방이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div style="margin-top: 24px;">
                <a th:href="@{/admin/users}" class="btn-secondary">← 유저 목록으로 돌아가기</a>
            </div>
        </main>
    </div>
</body>
</html>
