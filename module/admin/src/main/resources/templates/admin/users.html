<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: header('가입자 목록')}"></head>
<body>
    <div class="app-container">
        <div th:replace="~{admin/layout :: sidebar('users')}"></div>
        
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">가입자 목록</h1>
                    <p class="page-subtitle">서비스에 등록된 회원들의 상태를 관리합니다.</p>
                </div>
            </div>
            
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Nickname</th>
                            <th>가입일시</th>
                            <th>접속 상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="'@' + ${user.username}">@username</td>
                            <td th:text="${user.nickname}">nickname</td>
                            <td th:text="${user.createdAt}">2026-07-19T00:00:00Z</td>
                            <td>
                                <span class="badge" th:classappend="${user.online} ? 'badge-online' : 'badge-offline'" th:text="${user.online} ? 'Online' : 'Offline'"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/{username}/chats(username=${user.username})}" class="link-action">채팅 보기</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" style="text-align: center; color: var(--text-secondary);">회원이 존재하지 않습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination-container" th:if="${nextCursor != null}">
                <a th:href="@{/admin/users(cursor=${nextCursor},size=${size})}" class="btn-secondary">다음 페이지 →</a>
            </div>
        </main>
    </div>
</body>
</html>
