<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Langlez Admin'"></title>
    <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>

<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-logo">
        <span>Langlez Admin</span>
    </div>
    <ul class="sidebar-menu">
        <li class="menu-item" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <a th:href="@{/admin}">
                <span>대시보드</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'users'} ? 'active'">
            <a th:href="@{/admin/users}">
                <span>가입자 목록</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'chats'} ? 'active'">
            <a th:href="@{/admin/chats}">
                <span>채팅 모니터링</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'echoes'} ? 'active'">
            <a th:href="@{/admin/echoes}">
                <span>게시물 모니터링</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'reports'} ? 'active'">
            <a th:href="@{/admin/reports}">
                <span>신고 이력</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'attachments'} ? 'active'">
            <a th:href="@{/admin/attachments}">
                <span>첨부파일 모아보기</span>
            </a>
        </li>
        <li class="menu-item" th:classappend="${activePage == 'interests'} ? 'active'">
            <a th:href="@{/admin/interests}">
                <span>관심사 관리</span>
            </a>
        </li>
    </ul>
    <div class="sidebar-footer">
        <form th:action="@{/admin/logout}" method="post" style="width: 100%;">
            <button type="submit" class="btn-secondary" style="width: 100%; border: none; text-align: left; background: transparent; padding: 12px 16px; border-radius: 10px; color: var(--text-secondary); display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; font-weight: 500; transition: var(--transition);">
                <span>로그아웃</span>
            </button>
        </form>
    </div>
</div>

</body>
</html>
