<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: header('로그인')}"></head>
<body>
    <div class="login-container">
        <div class="login-card glass">
            <h2>Langlez Console</h2>
            <p>관리자 계정으로 로그인해 주세요.</p>
            
            <div th:if="${param.error}" class="error-msg">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="error-msg" style="color: var(--accent); background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2);">
                성공적으로 로그아웃되었습니다.
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">로그인</button>
            </form>
        </div>
    </div>
</body>
</html>
