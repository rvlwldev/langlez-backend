<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: header('신고 이력')}"></head>
<body>
    <div class="app-container">
        <div th:replace="~{admin/layout :: sidebar('reports')}"></div>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">신고 이력</h1>
                    <p class="page-subtitle">접수된 모든 신고 내역을 모니터링하고 관리합니다.</p>
                </div>
            </div>

            <form method="get" th:action="@{/admin/reports}" style="display:flex; gap:8px; margin-bottom:16px;">
                <select name="sourceType" onchange="this.form.submit()">
                    <option value="">전체 출처</option>
                    <option value="ECHO_POST" th:selected="${sourceType?.name() == 'ECHO_POST'}">게시물 (ECHO_POST)</option>
                    <option value="CHAT_USER" th:selected="${sourceType?.name() == 'CHAT_USER'}">채팅 사용자 (CHAT_USER)</option>
                </select>
            </form>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>신고자</th>
                            <th>피신고자</th>
                            <th>출처 타입</th>
                            <th>출처 ID</th>
                            <th>사유</th>
                            <th>트리거 메시지 ID</th>
                            <th>신고 시각</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rep : ${reports}">
                            <td th:text="${rep.id}">1</td>
                            <td th:text="'@' + ${rep.reporterUsername}">@reporter</td>
                            <td th:text="'@' + ${rep.reportedUsername}">@reported</td>
                            <td th:text="${rep.sourceType}">ECHO_POST</td>
                            <td th:text="${rep.sourceId}">sourceId</td>
                            <td th:text="${rep.reason}">Reason</td>
                            <td th:text="${rep.triggerMessageId ?: '-'}">-</td>
                            <td th:text="${rep.createdAt}">2026-07-19T00:00:00Z</td>
                            <td>
                                <a th:if="${rep.sourceType == 'ECHO_POST'}" th:href="@{/admin/echoes}" class="link-action">게시물 보기</a>
                                <a th:if="${rep.sourceType == 'CHAT_USER'}" th:href="@{/admin/chats/{roomId}(roomId=${rep.sourceId})}" class="link-action">대화 확인</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="9" style="text-align: center; color: var(--text-secondary);">신고 내역이 존재하지 않습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-container" th:if="${nextCursor != null}">
                <a th:href="@{/admin/reports(cursor=${nextCursor},size=${size},sourceType=${sourceType})}" class="btn-secondary">다음 페이지 →</a>
            </div>
        </main>
    </div>
</body>
</html>
