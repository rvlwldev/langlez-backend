server:
  port: 8888

spring:
  application:
    name: langlez-config-server
  profiles:
    # 로컬은 폴더(config-repo)에서 읽는다. 운영은 git 으로 바꾼다:
    #   SPRING_PROFILES_ACTIVE=git, CONFIG_GIT_URI=https://github.com/<org>/langlez-config
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:./config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: main
