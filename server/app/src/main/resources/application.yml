server:
  port: 8080

spring:
  application:
    name: langlez-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/langlez_db?reWriteBatchedInserts=true
    username: admin
    password: admin
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000
  mongodb:
    uri: mongodb://localhost:27017/langlez_db?directConnection=true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_updates: true
        order_inserts: true

langlez:
  auth:
    supabase-url: ${SUPABASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
